name: CI

# NOTE: this is valid GitHub Actions YAML, validated with `actionlint`.
# Each step's underlying command (pytest, flake8, docker build) has been
# run locally; the workflow wires them together the way GitHub Actions
# expects.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest requests

      - name: Lint with flake8
        run: |
          flake8 app monitoring --max-line-length=120 --extend-ignore=E203,W503

      - name: Run test suite
        run: |
          pytest tests/ -v

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        # NOTE: the Dockerfile builds FROM the public python:3.12-slim
        # image, which a GitHub Actions runner can pull directly, so
        # this step needs no special handling.
        run: |
          docker build -t devops-cicd-demo:${{ github.sha }} .

      - name: Smoke-test the built image
        run: |
          docker run -d --name smoke-test -p 8080:8080 devops-cicd-demo:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/healthz
          curl -f http://localhost:8080/readyz
          curl -f http://localhost:8080/metrics
          docker stop smoke-test
