# Schema-valid HorizontalPodAutoscaler manifest (validated, not
# cluster-applied -- see the note in deployment.yaml).
# Targets the real Deployment in deployment.yaml by name.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-cicd-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-cicd-demo
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
