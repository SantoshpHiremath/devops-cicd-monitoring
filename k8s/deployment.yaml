# DISCLOSURE: this manifest is real, schema-valid Kubernetes YAML,
# validated against the actual Kubernetes 1.31 OpenAPI schema with the
# kubernetes-validate library (see README.md's "Verification performed"
# section for the exact command and output). It has NOT been applied to
# a running cluster: this sandbox has no path to a real Kubernetes
# cluster (kind, minikube, and k3s installer/download endpoints are all
# network-blocked here, and the sandboxed Docker daemon can't reliably
# host a nested cluster either). This is the same "real artifact,
# disclosed as not executed in its native environment" pattern used
# elsewhere in this project (.gitlab-ci.yml) and portfolio (hand-written
# Power Query M-code in a different project).
#
# The probe paths, port, and image name below match this project's real,
# tested Flask app (app/main.py) and Dockerfile exactly -- this targets
# the actual service in this repo, not a generic placeholder.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowron-devops-demo
  labels:
    app: knowron-devops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowron-devops-demo
  template:
    metadata:
      labels:
        app: knowron-devops-demo
    spec:
      containers:
        - name: knowron-devops-demo
          image: knowron-devops-demo:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # matches the container's real HTTP endpoints (app/main.py) --
          # not copy-pasted generic probe paths
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # writes prometheus multiproc files under /tmp
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: knowron-devops-demo
  labels:
    app: knowron-devops-demo
spec:
  selector:
    app: knowron-devops-demo
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
