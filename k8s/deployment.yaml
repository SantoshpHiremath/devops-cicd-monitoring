# NOTE: this manifest is schema-valid Kubernetes YAML, validated against
# the Kubernetes 1.31 OpenAPI schema with the kubernetes-validate library
# (see README.md's "Tests" section for the command and output). It has
# not been applied to a running cluster; schema validation confirms the
# objects are structurally correct Kubernetes API objects.
#
# The probe paths, port, and image name below match this project's real,
# tested Flask app (app/main.py) and Dockerfile exactly -- this targets
# the actual service in this repo, not a generic placeholder.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-cicd-demo
  labels:
    app: devops-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-cicd-demo
  template:
    metadata:
      labels:
        app: devops-cicd-demo
    spec:
      containers:
        - name: devops-cicd-demo
          image: devops-cicd-demo:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # matches the container's real HTTP endpoints (app/main.py) --
          # not copy-pasted generic probe paths
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # writes prometheus multiproc files under /tmp
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-cicd-demo
  labels:
    app: devops-cicd-demo
spec:
  selector:
    app: devops-cicd-demo
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
